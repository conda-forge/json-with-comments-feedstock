schema_version: 1

context:
  version: "1.3.0"

package:
  name: json-with-comments
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/json-with-comments/json_with_comments-${{ version }}.tar.gz
  sha256: 8e9668f9aaa9f50cb546828da958c606e45f3866daceb51f16b0ee61985c0677

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: JSON with Comments (jsonc) for Python
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/json-with-comments/
  repository: https://github.com/n-takumasa/json-with-comments
  documentation: https://github.com/n-takumasa/json-with-comments

extra:
  recipe-maintainers:
    - achimgaedke
